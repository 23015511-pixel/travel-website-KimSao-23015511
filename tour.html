<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tour</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Danh sách tour</h1>

<div class="tour-list">
    <div class="card">
        <h3>Hà Giang</h3>
        <p>3 ngày 2 đêm</p>
        <p>2.000.000đ</p>
        <button onclick="chonTour('Hà Giang')">Chọn tour</button>
    </div>

    <div class="card">
        <h3>Đà Nẵng</h3>
        <p>4 ngày 3 đêm</p>
        <p>3.000.000đ</p>
        <button onclick="chonTour('Đà Nẵng')">Chọn tour</button>
    </div>

    <div class="card">
        <h3>Phú Quốc</h3>
        <p>3 ngày 2 đêm</p>
        <p>4.000.000đ</p>
        <button onclick="chonTour('Phú Quốc')">Chọn tour</button>
    </div>

    <div class="card">
        <h3>Sapa</h3>
        <p>2 ngày 1 đêm</p>
        <p>1.500.000đ</p>
        <button onclick="chonTour('Sapa')">Chọn tour</button>
    </div>
</div>

<p id="thongbao"></p>

<script src="js/script.js"></script>

</body>
</html>
